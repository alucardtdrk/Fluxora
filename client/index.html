<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#280E59" />
    <meta name="description" content="Fluxora — Automação sob controle." />
    <link rel="icon" type="image/png" href="/fluxora-mark-transparent.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Fluxora — Automation Control Center</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      const endpoint = import.meta.env.VITE_ANALYTICS_ENDPOINT;
      const websiteId = import.meta.env.VITE_ANALYTICS_WEBSITE_ID;
      if (endpoint && websiteId) {
        const script = document.createElement("script");
        script.src = `${endpoint.replace(/\/$/, "")}/umami`;
        script.defer = true;
        script.dataset.websiteId = websiteId;
        document.head.appendChild(script);
      }
    </script>
  </body>
</html>
