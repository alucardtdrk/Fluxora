name: Verificações do Fluxora

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Tipos, testes e build
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar pnpm
        uses: pnpm/action-setup@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Validar tipos
        run: pnpm check

      - name: Executar testes
        run: pnpm test

      - name: Gerar build de produção
        run: pnpm build:vercel
